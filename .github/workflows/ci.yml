name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - run: make lint

  format:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - run: make format-check

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: make install
      - run: make test
      - run: python -c "import sky; import iwant.cli"
      - run: iwant --help

  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("CI jobs did not succeed: " + ", ".join(failed))
          PYTHON
