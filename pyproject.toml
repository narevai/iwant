[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iwant"
version = "0.2.0"
description = "CLI for launching open-weight models on bare-metal GPU servers"
requires-python = ">=3.9,<3.15"
dependencies = [
  "click>=8.1.8,<8.2.0",
  "skypilot[gcp]>=0.13.0",
  "questionary>=2.1.1",
  "pyyaml>=6.0.3",
  "pydantic>=2.10,<3",
  "typing-extensions>=4.5",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.6",
  "basedpyright>=1.39.10,<1.40; python_version < '3.10'",
  "basedpyright>=1.40.2,<2; python_version >= '3.10'",
  "types-PyYAML>=6.0",
  "types-requests>=2.31",
]

[project.scripts]
iwant = "iwant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iwant"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["iwant", "demo", "tests"]
pythonVersion = "3.9"
