# DeepSeek-V4.1-Flash, 8x H200, TP8. 552B/8-16B active MoE, 1M context.
# Needs vllm/vllm-openai:nightly (no stable pip wheel for this arch yet).

envs:
  MODEL_NAME: deepseek-ai/DeepSeek-V4.1-Flash
  VLLM_API_KEY: changeme-placeholder # overridden by `iwant launch` (--env/--api-key) at launch time
  VLLM_ENGINE_READY_TIMEOUT_S: "3600" # first load downloads a ~511GB checkpoint

resources:
  infra: gcp
  accelerators: H200:8
  cpus: 32+
  memory: 256+ # Engram tables offload to pinned host RAM, not VRAM
  disk_size: 150 # just OS/docker image - the checkpoint goes on local SSD, see setup:
  ports:
    - 8000

setup: |
  set -euo pipefail
  boot_dev=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)" 2>/dev/null || true)
  local_devs=$(lsblk -dn -o NAME,TYPE | awk -v b="$boot_dev" '$2=="disk" && $1!=b {print "/dev/"$1}')
  if [ -n "$local_devs" ]; then
    sudo apt-get -qq update && sudo apt-get -qq install -y mdadm >/dev/null
    n=$(echo "$local_devs" | wc -l)
    if [ "$n" -gt 1 ]; then
      sudo mdadm --create /dev/md0 --level=0 --raid-devices="$n" $local_devs --run
      target=/dev/md0
    else
      target=$local_devs
    fi
    sudo mkfs.ext4 -F -q "$target"
    sudo mkdir -p /mnt/localssd
    sudo mount "$target" /mnt/localssd
    sudo chown "$(whoami):$(whoami)" /mnt/localssd
    mkdir -p /mnt/localssd/huggingface
  fi
  sudo docker pull vllm/vllm-openai:nightly

run: |
  set -euo pipefail
  hf_cache="$HOME/.cache/huggingface"
  [ -d /mnt/localssd/huggingface ] && hf_cache=/mnt/localssd/huggingface
  mkdir -p "$hf_cache"
  sudo docker run --rm --gpus all --network host --ipc host \
      -v "$hf_cache:/root/.cache/huggingface" \
      -e VLLM_ENGINE_READY_TIMEOUT_S="$VLLM_ENGINE_READY_TIMEOUT_S" \
      vllm/vllm-openai:nightly \
      "$MODEL_NAME" \
      --host 0.0.0.0 \
      --port 8000 \
      --api-key "$VLLM_API_KEY" \
      --tokenizer-mode deepseek_v41 \
      --tensor-parallel-size 8 \
      --language-model-only \
      --engram-config '{"cpu_offload":true}' \
      --tool-call-parser deepseek_v41 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v41 \
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":true}'
