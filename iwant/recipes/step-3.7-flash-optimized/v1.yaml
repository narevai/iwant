# Step-3.7-Flash (StepFun), BF16, 8x H200 - throughput variant of
# step-3.7-flash. Official MTP-3 + Hopper's default CUDA-graph cap (512
# tokens) falls off the graph at 128 concurrent requests (128 x 4 = 512)
# and output tok/s drops ~50%. Capture 2048 / max-num-seqs 512 keeps MTP
# graphed through 512 concurrent. No --max-model-len: coding clients still
# get the model's 256k window. Needs vllm/vllm-openai:stepfun37.

envs:
  MODEL_NAME: stepfun-ai/Step-3.7-Flash
  VLLM_API_KEY: changeme-placeholder # overridden by `iwant launch` (--env/--api-key) at launch time

resources:
  infra: gcp
  accelerators: H200:8
  cpus: 16+
  memory: 64+
  disk_size: 150 # just OS/docker image - the checkpoint goes on local SSD, see setup:
  ports:
    - 8000

setup: |
  set -euo pipefail
  boot_dev=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)" 2>/dev/null || true)
  local_devs=$(lsblk -dn -o NAME,TYPE | awk -v b="$boot_dev" '$2=="disk" && $1!=b {print "/dev/"$1}')
  if [ -n "$local_devs" ]; then
    sudo apt-get -qq update && sudo apt-get -qq install -y mdadm >/dev/null
    n=$(echo "$local_devs" | wc -l)
    if [ "$n" -gt 1 ]; then
      sudo mdadm --create /dev/md0 --level=0 --raid-devices="$n" $local_devs --run
      target=/dev/md0
    else
      target=$local_devs
    fi
    sudo mkfs.ext4 -F -q "$target"
    sudo mkdir -p /mnt/localssd
    sudo mount "$target" /mnt/localssd
    sudo chown "$(whoami):$(whoami)" /mnt/localssd
    mkdir -p /mnt/localssd/huggingface
  fi
  sudo docker pull vllm/vllm-openai:stepfun37

run: |
  set -euo pipefail
  hf_cache="$HOME/.cache/huggingface"
  [ -d /mnt/localssd/huggingface ] && hf_cache=/mnt/localssd/huggingface
  mkdir -p "$hf_cache"
  sudo docker run --rm --gpus all --network host --ipc host \
      -v "$hf_cache:/root/.cache/huggingface" \
      vllm/vllm-openai:stepfun37 \
      "$MODEL_NAME" \
      --host 0.0.0.0 \
      --port 8000 \
      --api-key "$VLLM_API_KEY" \
      --served-model-name step3p7-flash \
      --tensor-parallel-size 8 \
      --enable-expert-parallel \
      --disable-cascade-attn \
      --reasoning-parser step3p5 \
      --tool-call-parser step3p5 \
      --enable-auto-tool-choice \
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}' \
      --max-cudagraph-capture-size 2048 \
      --max-num-seqs 512 \
      --trust-remote-code
